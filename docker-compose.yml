services:
  mysql:
    image: mysql:8
    container_name: sas-poc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sas_poc
      MYSQL_USER: sas
      MYSQL_PASSWORD: sas
    ports:
      - "3308:3306"

  redis:
    image: redis:7
    container_name: sas-poc-redis
    ports:
      - "6390:6379"
