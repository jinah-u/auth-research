server:
  port: 18081

spring:
  application:
    name: resource-server
  data:
    redis:
      host: localhost
      port: 6390
  session:
    store-type: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

logging:
  level:
    org.springframework.security: DEBUG
